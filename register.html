<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body style="margin:0; padding:0; font-family:Arial, sans-serif; background:#f4f4f4; display:flex; justify-content:center; align-items:center; height:100vh;">

    <div style="background:#fff; padding:30px; width:350px; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.2);">
        <h2 style="text-align:center; color:#333; margin-bottom:20px;">Register</h2>

        <form action="#" method="post">
            <label style="font-weight:bold;">Full Name</label><br>
            <input
                type="text"
                name="fullname"
                placeholder="Enter your full name"
                required
                style="width:100%; padding:10px; margin:8px 0 15px 0; border:1px solid #ccc; border-radius:5px; box-sizing:border-box;"
            >

            <label style="font-weight:bold;">Email</label><br>
            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
                style="width:100%; padding:10px; margin:8px 0 15px 0; border:1px solid #ccc; border-radius:5px; box-sizing:border-box;"
            >

            <label style="font-weight:bold;">Username</label><br>
            <input
                type="text"
                name="username"
                placeholder="Choose a username"
                required
                style="width:100%; padding:10px; margin:8px 0 15px 0; border:1px solid #ccc; border-radius:5px; box-sizing:border-box;"
            >

            <label style="font-weight:bold;">Password</label><br>
            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
                style="width:100%; padding:10px; margin:8px 0 15px 0; border:1px solid #ccc; border-radius:5px; box-sizing:border-box;"
            >

            <label style="font-weight:bold;">Confirm Password</label><br>
            <input
                type="password"
                name="confirmPassword"
                placeholder="Confirm your password"
                required
                style="width:100%; padding:10px; margin:8px 0 20px 0; border:1px solid #ccc; border-radius:5px; box-sizing:border-box;"
            >

            <button
                type="submit"
                style="width:100%; padding:12px; background:#007BFF; color:white; border:none; border-radius:5px; font-size:16px; cursor:pointer;"
            >
                Register
            </button>

            <p style="text-align:center; margin-top:15px;">
                Already have an account?
                <a href="login.html" style="color:#007BFF; text-decoration:none;">Login</a>
            </p>
        </form>
    </div>

</body>
</html>
