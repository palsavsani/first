<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
</head>
<body style="margin:0; font-family:Arial, sans-serif; background:#f2f2f2; display:flex; justify-content:center; align-items:center; height:100vh;">

    <div style="background:white; padding:30px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.2); width:300px;">
        <h2 style="text-align:center; color:#333;">Login</h2>

        <form>
            <label style="font-weight:bold;">Username</label><br>
            <input type="text" placeholder="Enter Username"
                style="width:100%; padding:10px; margin:8px 0 15px; border:1px solid #ccc; border-radius:5px; box-sizing:border-box;">

            <label style="font-weight:bold;">Password</label><br>
            <input type="password" placeholder="Enter Password"
                style="width:100%; padding:10px; margin:8px 0 20px; border:1px solid #ccc; border-radius:5px; box-sizing:border-box;">

            <button type="submit"
                style="width:100%; padding:10px; background:#007BFF; color:white; border:none; border-radius:5px; cursor:pointer;">
                Login
            </button>
        </form>

        <p style="text-align:center; margin-top:15px; font-size:14px;">
            Don't have an account?
            <a href="#" style="color:#007BFF; text-decoration:none;">Sign Up</a>
        </p>
    </div>

</body>
</html>
